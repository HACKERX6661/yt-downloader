<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean YT Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-3xl font-bold mb-2">No-Ad Downloader</h1>
        <p class="text-gray-400 mb-6 text-sm">Paste a link to download instantly.</p>
        
        <input 
            type="text" 
            id="urlInput" 
            placeholder="https://www.youtube.com/watch?v=..." 
            class="w-full p-4 rounded bg-gray-900 border border-gray-600 focus:outline-none focus:border-blue-500 mb-4 transition"
        >
        
        <button 
            id="btn"
            onclick="process()" 
            class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded font-bold transition transform active:scale-95"
        >
            Get Download Link
        </button>

        <div id="result" class="mt-6 hidden">
            <a id="downloadLink" href="#" target="_blank" class="block w-full py-3 bg-green-600 hover:bg-green-500 rounded font-bold">
                Download Now
            </a>
        </div>
        <p id="status" class="mt-4 text-sm text-gray-500"></p>
    </div>

    <script>
        async function process() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            const link = document.getElementById('downloadLink');

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                status.innerText = "Please enter a valid YouTube link.";
                return;
            }

            status.innerText = "Fetching...";
            
            // Using a clean API service to handle the heavy lifting
            try {
                const videoId = url.split('v=')[1] || url.split('/').pop();
                const downloadUrl = `https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=mp4`;
                
                // We display the direct download trigger
                link.href = downloadUrl;
                result.classList.remove('hidden');
                status.innerText = "Ready!";
            } catch (e) {
                status.innerText = "Something went wrong.";
            }
        }
    </script>
</body>
</html>
