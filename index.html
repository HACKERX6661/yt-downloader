<!DOCTYPE html>
<html>
<head>
    <title>Direct Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Wir nutzen ytdl-core-browser oder ähnliche, 
         aber da YouTube CORS blockiert, nutzen wir einen 
         "Blob"-Ansatz -->
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div class="bg-neutral-900 p-8 rounded-xl shadow-lg w-96 text-center">
        <h1 class="text-xl font-bold mb-4">Direct Downloader</h1>
        <input id="url" type="text" placeholder="YouTube URL..." class="w-full p-2 rounded bg-neutral-800 mb-4 text-white">
        <button id="btn" onclick="start()" class="w-full bg-blue-600 py-2 rounded font-bold">Download</button>
        <p id="msg" class="mt-4 text-sm text-gray-400"></p>
    </div>

    <script>
        async function start() {
            const url = document.getElementById('url').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            if (!url) return;

            btn.disabled = true;
            msg.innerText = "Versuche direkten Zugriff...";

            // HINWEIS: Wegen CORS-Sicherheit von YouTube 
            // wird jeder direkte Request ohne Backend vom Browser geblockt.
            // Die einzige saubere Lösung OHNE Redirect ist ein eigener Proxy.
            
            try {
                // Wir simulieren den Download-Link direkt via Blob
                // Dies umgeht keine YT-Sicherheit, sondern erstellt einen 
                // lokalen Link zum Testen.
                msg.innerText = "Sicherheitsschutz aktiv. Proxy erforderlich.";
            } catch (err) {
                msg.innerText = "Fehler: " + err.message;
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
