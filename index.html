<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean YouTube Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full p-8 bg-gray-800 rounded-xl shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-6">YouTube Downloader</h1>
        <p class="text-gray-400 mb-6 text-sm">Paste your link below. No ads, no popups.</p>
        
        <input 
            type="text" 
            id="urlInput" 
            placeholder="https://www.youtube.com/watch?v=..." 
            class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 mb-4"
        >
        
        <button 
            onclick="downloadVideo()" 
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded font-semibold transition"
        >
            Download Now
        </button>

        <div id="status" class="mt-4 text-sm text-gray-300"></div>
    </div>

    <script>
        function downloadVideo() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            
            if (!url) {
                status.innerText = "Please paste a link first!";
                return;
            }

            status.innerText = "Processing... (This usually takes a moment)";
            
            // This is where we will eventually connect to your Python backend
            console.log("Downloading:", url);
        }
    </script>
</body>
</html>
