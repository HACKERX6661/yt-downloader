<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clean Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div class="bg-gray-900 p-8 rounded-xl w-96 text-center border border-gray-700">
        <h1 class="text-xl font-bold mb-4">Downloader</h1>
        <input id="url" type="text" placeholder="Paste YouTube Link" class="w-full p-2 rounded bg-gray-800 mb-4 border border-gray-700">
        <button onclick="go()" class="w-full bg-blue-600 py-2 rounded font-bold hover:bg-blue-500">Get Download</button>
        <div id="result" class="mt-4"></div>
    </div>

    <script>
        function go() {
            const url = document.getElementById('url').value;
            const res = document.getElementById('result');
            if(!url) return;
            // Using a direct, clean embed-based downloader
            const videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
            res.innerHTML = `<iframe src="https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=mp4" style="width:100%;height:60px;border:none;"></iframe>`;
        }
    </script>
</body>
</html>
