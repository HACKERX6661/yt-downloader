name: Video Downloader
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install yt-dlp
        run: pip install yt-dlp
      - name: Download
        run: yt-dlp -f mp4 "${{ github.event.inputs.url }}"
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: video
          path: '*.mp4'
